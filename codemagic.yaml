# ─────────────────────────────────────────────────────────────────────────────
# GBH Nutrición · fábrica de las apps de tienda
#
# POR QUÉ CODEMAGIC Y NO EL PC: compilar para iOS exige macOS y Xcode. El PC de
# trabajo es Windows y no tiene ni Node ni Java. Estas dos recetas construyen
# las dos apps en la nube, así que el proceso funciona igual desde Pamplona que
# desde fuera de España, y no depende de que haya un ordenador concreto encendido.
#
# DISPARO AUTOMÁTICO (nivel 1 del BRIEF_actualizaciones_automaticas, 5-sep-2026):
# cada push a la rama `tiendas` compila las dos apps; iOS sube sola a TestFlight y
# el AAB de Android queda en los artefactos hasta que exista el grupo `gbh_play`.
# Un push a `main` sigue SIN publicar nada en tiendas: hay que fusionarlo aquí.
# Las recetas se pueden seguir lanzando a mano desde codemagic.io.
#
# Los proyectos `android/` e `ios/` NO están en el repositorio: se generan en
# cada build con `cap add` y se parchean con `scripts/prep-native.mjs`.
# ─────────────────────────────────────────────────────────────────────────────

definitions:
  cache: &cache
    cache_paths:
      - $HOME/.npm

workflows:

  # ══ ANDROID ════════════════════════════════════════════════════════════════
  android:
    name: "GBH · Android (AAB para Google Play)"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: tiendas
          include: true
          source: true
      cancel_previous_builds: true
    max_build_duration: 60
    # linux_x2 no entra en el plan gratuito; el Mac M2 si (500 min/mes)
    instance_type: mac_mini_m2
    environment:
      # gbh_play (GCLOUD_SERVICE_ACCOUNT_CREDENTIALS) se anadira cuando
      # exista la cuenta de Play y su service account (CHECKLIST B3).
      android_signing:
        - gbh_keystore        # el almacén de firma, subido en Codemagic
      node: 22
      java: 21
    cache: *cache
    scripts:
      - name: Dependencias
        script: npm install
      - name: Compilar la web (Vite)
        script: npm run build
      - name: Generar el proyecto Android
        script: |
          if [ ! -d android ]; then npx cap add android; fi
      - name: Parches nativos (API 36 + versionCode)
        script: BUILD_NUMBER=$PROJECT_BUILD_NUMBER npm run native:prep
      - name: Iconos y pantalla de carga
        script: npx capacitor-assets generate --android --iconBackgroundColor '#081208' --splashBackgroundColor '#081208'
      - name: Sincronizar web -> nativo
        script: npx cap sync android
      - name: Comprobar que el targetSdk es 36 (lo exige Play desde el 31-ago-2026)
        script: |
          grep -q 'targetSdkVersion = 36' android/variables.gradle \
            || { echo "targetSdkVersion NO es 36 — Play rechazaría el AAB"; exit 1; }
      - name: Construir el AAB firmado
        script: cd android && ./gradlew bundleRelease assembleRelease
      - name: Comprobar el manifiesto final de los avisos (sin alarmas exactas, con POST_NOTIFICATIONS)
        script: |
          M=$(find android/app/build/intermediates -name AndroidManifest.xml -path '*merged_manifest*' -path '*release*' | head -1)
          if [ -z "$M" ]; then echo "AVISO: no encuentro el manifiesto fusionado de release; no se comprueba"; exit 0; fi
          echo "manifiesto fusionado: $M"
          if grep -q 'SCHEDULE_EXACT_ALARM\|USE_EXACT_ALARM' "$M"; then
            echo "El manifiesto pide alarmas exactas: Play las restringe (BRIEF_notificaciones.md §4.3)"; exit 1
          fi
          grep -q 'POST_NOTIFICATIONS' "$M" || { echo "Falta POST_NOTIFICATIONS: los avisos no se podrían pedir"; exit 1; }
          echo "OK: sin alarmas exactas y con POST_NOTIFICATIONS"
      - name: Comprobar los pasos del movil (Health Connect SOLO con READ_STEPS, sensor y minSdk 26)
        script: |
          M=$(find android/app/build/intermediates -name AndroidManifest.xml -path '*merged_manifest*' -path '*release*' | head -1)
          [ -n "$M" ] || { echo "No encuentro el manifiesto fusionado de release"; exit 1; }
          H=$(grep -o 'android.permission.health.[A-Z_]*' "$M" | sort -u | tr '\n' ' ')
          echo "permisos de salud en el manifiesto: $H"
          [ "$H" = "android.permission.health.READ_STEPS " ] || { echo "Health Connect debe pedir SOLO READ_STEPS: Play exige justificar cada permiso (BRIEF_pasos.md)"; exit 1; }
          grep -q 'android.permission.ACTIVITY_RECOGNITION' "$M" || { echo "Falta ACTIVITY_RECOGNITION: sin pasos en vivo"; exit 1; }
          grep -q 'androidx.health.ACTION_SHOW_PERMISSIONS_RATIONALE' "$M" || { echo "Falta la pantalla de la politica para Health Connect (Android 13-)"; exit 1; }
          grep -q 'android.intent.action.VIEW_PERMISSION_USAGE' "$M" || { echo "Falta la pantalla de la politica para Health Connect (Android 14+)"; exit 1; }
          grep -q 'minSdkVersion = 26' android/variables.gradle || { echo "minSdk no es 26: Health Connect lo exige"; exit 1; }
          echo "OK: pasos del movil con READ_STEPS, ACTIVITY_RECOGNITION, politica y minSdk 26"
    artifacts:
      - android/app/build/outputs/bundle/**/*.aab
      - android/app/build/outputs/apk/**/*.apk
      - android/app/build/outputs/**/mapping.txt
    publishing:
      email:
        recipients: [gbh.nutricion@gmail.com]
        notify: { success: true, failure: true }
      # google_play: se reactivara cuando exista la cuenta de Play;
      # la PRIMERA subida del AAB es manual de todos modos.

  # ══ iOS ════════════════════════════════════════════════════════════════════
  ios:
    name: "GBH · iOS (IPA para TestFlight)"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: tiendas
          include: true
          source: true
      cancel_previous_builds: true
    max_build_duration: 90
    instance_type: mac_mini_m2
    # La clave de API de App Store Connect se guarda en Codemagic
    # (Teams > Integrations > Apple Developer Portal) con ESTE nombre.
    # Sin este bloque, `auth: integration` y la firma automatica fallan.
    integrations:
      app_store_connect: gbh_asc
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: es.gbhnutricion.app
      node: 22
      xcode: latest
      cocoapods: default
    cache: *cache
    scripts:
      - name: Dependencias
        script: npm install
      - name: Compilar la web (Vite)
        script: npm run build
      - name: Generar el proyecto iOS
        script: |
          if [ ! -d ios ]; then npx cap add ios; fi
      - name: Parches nativos (Info.plist + build number)
        script: BUILD_NUMBER=$PROJECT_BUILD_NUMBER npm run native:prep
      - name: Iconos y pantalla de carga
        script: npx capacitor-assets generate --ios --iconBackgroundColor '#081208' --splashBackgroundColor '#081208'
      - name: Sincronizar web -> nativo (Capacitor 8 usa SPM, sin pods ni workspace)
        script: npx cap sync ios
      - name: Comprobar los permisos de cámara y fotos en el Info.plist
        script: |
          for k in NSCameraUsageDescription NSPhotoLibraryUsageDescription ITSAppUsesNonExemptEncryption; do
            grep -q "$k" ios/App/App/Info.plist || { echo "Falta $k en Info.plist"; exit 1; }
          done
      - name: Comprobar los pasos del movil en iOS (podometro si; Health Connect y HealthKit no)
        script: |
          grep -q NSMotionUsageDescription ios/App/App/Info.plist || { echo "Falta NSMotionUsageDescription: iOS mataria la app al leer los pasos"; exit 1; }
          P=ios/App/CapApp-SPM/Package.swift
          grep -q 'capacitor-pedometer' "$P" || { echo "El podometro no entro en el proyecto iOS"; exit 1; }
          if grep -q 'capacitor-health' "$P"; then echo "Health Connect entro en iOS y arrastra HealthKit: revisar ios.includePlugins"; exit 1; fi
          # ios.includePlugins es una LISTA BLANCA: un complemento nuevo que no este en ella no
          # entra en el iPhone y nadie lo nota. Se tumba la build si alguno se queda fuera.
          node -e "const p=require('./package.json'),c=require('./capacitor.config.json');const fuera=['@capgo/capacitor-health','@capacitor/android','@capacitor/ios','@capacitor/core'];const n=Object.keys(p.dependencies).filter(d=>{try{return !!require('./node_modules/'+d+'/package.json').capacitor}catch(e){return false}}).filter(d=>!fuera.includes(d)&&!c.ios.includePlugins.includes(d));if(n.length){console.log('Complementos fuera de ios.includePlugins: '+n.join(', '));process.exit(1)}console.log('OK: todos los complementos de iOS estan en ios.includePlugins')"
          echo "OK: iOS con podometro, sin Health Connect"
      - name: Comprobar que el binario es SOLO para iPhone (iPad fuera, 12-sep-2026)
        script: |
          grep -q 'TARGETED_DEVICE_FAMILY = "1";' ios/App/App.xcodeproj/project.pbxproj \
            || { echo "El pbxproj NO esta limitado a iPhone — el binario declararia iPad y la ficha no tiene capturas de iPad"; exit 1; }
          if grep -q 'TARGETED_DEVICE_FAMILY = "1,2";' ios/App/App.xcodeproj/project.pbxproj; then
            echo "Queda algun target declarando iPad (1,2)"; exit 1
          fi
          echo "OK: el proyecto iOS es solo para iPhone"
      - name: Aplicar perfiles de firma al proyecto
        # keychain initialize NO va aqui: crea un llavero vacio y machaca el
        # que la firma automatica (environment.ios_signing) acaba de preparar.
        # Fallo del build #5 en 'Construir el IPA'.
        script: xcode-project use-profiles
      - name: Construir el IPA
        script: |
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients: [gbh.nutricion@gmail.com]
        notify: { success: true, failure: true }
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Cada build entra SOLA en el grupo externo de pacientes (orden de Alejandro,
        # 26-sep, MAESTRO-2026-655; revoca MAESTRO-2026-431, que la dejaba a mano
        # «salvo que la fase de TestFlight se alargue»). El nombre debe coincidir
        # EXACTO con el de App Store Connect. Codemagic lo reparte al acabar Apple
        # de procesar la build; TestFlight avisa a los testers y, si tienen las
        # actualizaciones automaticas activadas, se instala sola.
        beta_groups:
          - "Pacientes GBH"
        submit_to_app_store: false   # la subida a revisión se hace a mano
